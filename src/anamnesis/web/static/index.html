<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anamnesis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <span class="brand">Anamnesis</span>
        <span id="memory-count" class="muted-small"></span>
      </div>
      <form id="search-form" role="search">
        <input id="search" type="search" placeholder="Search all memory…  (/)" autocomplete="off">
        <select id="source-filter" aria-label="Show conversations from">
          <option value="">All tools</option>
        </select>
      </form>
      <div id="search-results" hidden>
        <div class="list-head"><span>Results</span><button id="clear-search" class="link">Close</button></div>
        <ul id="search-list"></ul>
      </div>
      <ul id="threads" aria-label="Conversations"></ul>
      <div id="conn" class="conn"><span class="dot"></span><span id="conn-text">Connecting…</span></div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="toggle-sidebar" class="btn icon" aria-label="Toggle conversations">☰</button>
        <h1 id="thread-title" title="Double-click to rename">Anamnesis</h1>
        <span id="thread-meta" class="muted-small"></span>
      </header>
      <section id="messages" aria-live="polite">
        <div id="empty" class="empty">
          <h2>Nothing in memory yet</h2>
          <p>Run <code>anam setup</code> to import your Claude Code, Codex, Gemini CLI and Cursor history,
            or <code>anam import &lt;export.zip&gt;</code> for ChatGPT, claude.ai and Gemini.</p>
        </div>
      </section>
    </main>
  </div>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
