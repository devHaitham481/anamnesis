[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnesis"
version = "0.1.0"
description = "One local memory shared by all your AI tools (Claude Code, Codex, Gemini CLI, Cursor, ChatGPT, claude.ai, Gemini)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "lancedb>=0.20",
    "pyarrow>=15",
    "fastembed>=0.5",
    "textual>=0.80",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "mcp>=2.3,<3",
    "zstandard>=0.22",
    "cryptography>=42",
]

[project.scripts]
anam = "anamnesis.cli.__main__:main"
anam-web = "anamnesis.web.__main__:main"
anam-mcp = "anamnesis.memory_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]
e2e = ["playwright>=1.45"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anamnesis*"]

[tool.setuptools.package-data]
"anamnesis.cli" = ["*.tcss"]
"anamnesis.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning", "ignore::UserWarning:pydantic.*"]

[tool.ruff]
line-length = 100
src = ["src", "."]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_ingest.py" = ["E501"]  # verbatim fixture records from each tool

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
