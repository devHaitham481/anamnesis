[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-ai"
version = "0.1.0"
description = "Local-first unified multi-provider AI platform & CLI"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
    "lancedb>=0.20",
    "pyarrow>=15",
    "fastembed>=0.5",
    "textual>=0.80",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
nexus = "src.cli.__main__:main"
nexus-web = "src.web.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
]
e2e = ["playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.cli" = ["*.tcss"]
"src.web" = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: hits real provider APIs (skipped when keys are missing)"]
filterwarnings = ["error::RuntimeWarning", "ignore::UserWarning:pydantic.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
