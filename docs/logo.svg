  <rect x="24" y="32" width="22" height="7" rx="3.5" fill="#6b665e"/>
  <rect x="24" y="52.5" width="28" height="7" rx="3.5" fill="#9a948a"/>
  <rect x="24" y="73" width="16" height="7" rx="3.5" fill="#6b665e"/>
  <circle cx="79" cy="56" r="14" fill="none" stroke="#e07a4f" stroke-width="7"/>
  <circle cx="79" cy="56" r="4" fill="#e07a4f"/>
  <!-- wordmark -->
  <text x="132" y="74" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
        font-size="50" font-weight="600" letter-spacing="-1"><tspan fill="#c8653a">anam</tspan><tspan fill="#8a8378">nesis</tspan></text>
