# Fly.io config for an Anamnesis node. Easiest: `anam node deploy fly` (creates the app, the
# volume and the password secret, then links this computer). Using Fly's "Launch from GitHub"
# instead? Also run: fly volumes create anamnesis_data --size 1
#                    fly secrets set ANAMNESIS_NODE_PASSWORD=<12+ characters>
app = "anamnesis-node"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  ANAMNESIS_DATA_DIR = "/data"
  PORT = "8080"

[mounts]
  source = "anamnesis_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "90s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
